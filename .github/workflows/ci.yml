name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check turboquant_pro/ tests/ benchmarks/

      - name: Format check with black
        run: black --check turboquant_pro/ tests/ benchmarks/

      # Type check with ty (Astral). Advisory for now — the mature codebase has a
      # backlog of strict-union diagnostics; this surfaces them without gating CI.
      # Promote to a hard gate once the count is triaged down.
      - name: Type check with ty (advisory)
        run: |
          pip install ty
          ty check turboquant_pro/
        continue-on-error: true

      # The WHOLE suite, not a hand-picked list. Files that need an optional
      # dependency (torch, transformers, cupy, faiss, duckdb, psycopg2, vllm,
      # triton) importorskip it at module scope and show up as skips here; they
      # run in the torch lane below or on the GPU box. Coverage is reported, not
      # yet gated (CODE_QUALITY.md P1) — the number is the baseline for the
      # future gate.
      - name: Run tests
        run: pytest tests/ --cov=turboquant_pro --cov-report=term -q
        # tests/test_claims_glove.py: runs `tqp replay embedding_glove_recall
        # --small` against the real claims.yaml, gating the canonical GloVe
        # recall claim on a hermetic bundled subset (numpy + core only).
        # tests/test_claims_ledger.py: CLAIMS.md and claims.yaml must agree on
        # every claim id and status.

  # The console's terminal client (go/tqp-console) and the two-process terminal
  # UI end to end: every job-control path (Ctrl-C, Ctrl-Z/fg, bg, a stop and
  # continue from outside, SIGTERM, SIGHUP) under an interactive bash in a
  # pseudo-terminal, checking the terminal is left normal from the bytes written
  # and that no client or engine process is left over.
  console-terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Go client
        working-directory: go/tqp-console
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go build -o tqp-console .
      - name: Terminal UI tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q tests/test_console_terminal.py tests/test_console.py tests/test_console_setup.py

  # The compiled AVX2 ADC kernel (turboquant_pro/_adc). The main matrix never builds
  # it, so its tests skip there; this job compiles it and checks it against an exact
  # integer replay of its own arithmetic, including sums past 16 bits (the v1 kernel
  # wrapped silently for more than 257 dims).
  adc-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and build the kernel
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pybind11
          python -m turboquant_pro._adc
      - name: Kernel tests
        run: pytest -q tests/test_adc_kernel.py
      # The kernel's own arithmetic replay is not enough: for a long time it
      # passed here while four tests in the index and IVF suites failed on any
      # box that had built the kernel, because the whole-suite job never builds
      # it and this job never ran them (issue #171). The consumers of the
      # kernel are now exercised in the configuration where it exists.
      - name: Index and IVF suites with the kernel present
        run: pytest -q tests/test_index.py tests/test_ivf.py tests/test_kernel_contract.py tests/test_adc_inner_product.py

  # numpy's promotion rules changed at 2.0 (NEP 50), and the project supports
  # both sides of that line: pyproject asks for numpy>=1.21. Every lane above
  # installs whatever pip resolves, which is always the newest numpy, so the
  # entire 1.x half of the supported range had never run. That is how a test
  # that only worked under NEP 50 shipped, and why it looked like a GPU problem
  # when it surfaced on a machine that happened to have an old numpy (#123).
  #
  # Sized from a measured matrix on 1.26.0, 1.26.4, 2.0.2, 2.1.3, 2.2.6, 2.3.5,
  # 2.4.6 and 2.5.3: all green, 2023 passed and 0 failed on each. The floor and
  # the boundary are what this lane guards; the versions between them behaved
  # identically and do not each need a job.
  #
  # 1.26 is the oldest numpy with a Python 3.12 wheel. The declared floor,
  # 1.21, cannot be installed on 3.12 at all, so it is tested on 3.10 here;
  # without that, "numpy>=1.21" would stay a claim no lane could check.
  numpy-range:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the declared floor, on the newest interpreter that can host it
          - python-version: "3.10"
            numpy: "1.21.6"
          # the last 1.x: legacy value-based promotion
          - python-version: "3.12"
            numpy: "1.26.4"
          # the first 2.x: NEP 50 weak scalars, the other side of the boundary
          - python-version: "3.12"
            numpy: "2.0.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with a pinned numpy
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==${{ matrix.numpy }}"
          # --no-deps so nothing quietly upgrades numpy back to latest, which
          # would make this lane a duplicate of the one above
          pip install --no-deps -e .
          pip install pytest pyyaml jsonschema
      - name: Show what is actually installed
        run: python -c "import numpy, sys; print('numpy', numpy.__version__, 'python', sys.version)"
      - name: Test
        run: pytest -q tests

  # Python 3.9 lane. pyproject advertises >=3.9, and a 2026-09-03 probe showed
  # the library passes there (996/999; the 3 failures were one zip(strict=)
  # call, since fixed) — but the pinned lint tooling (black 26.x, ty) needs
  # 3.10+, so 3.9 gets the library + pytest only and no lint/format steps.
  # Drop this job and bump requires-python together, never one without the other.
  test-py39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install library + test deps (no lint tooling on 3.9)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov pyyaml jsonschema pybind11

      - name: Run tests
        run: pytest tests/ -q

  # CPU torch + transformers lane. The numpy-only matrix above skips every
  # torch-gated file; this lane runs them for real on CPU wheels so a
  # transformers API change (the 2026-09 get_mask_sizes contract bug was
  # invisible for two months) fails the merge instead of a developer's
  # laptop. transformers is pinned exactly: bump one green pin at a time and
  # keep >= 4.56 (first release with the layered CacheLayerMixin API that
  # turboquant_pro.hf_cache targets).
  torch-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (CPU torch, pinned transformers)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==5.3.0"

      - name: Run torch-gated tests
        run: >
          pytest -q
          tests/test_hf_cache.py
          tests/test_kvquant_kivi.py
          tests/test_model_compress_shape.py
          tests/test_torch_backend.py
          tests/test_operator_trace.py
          tests/test_cli.py
