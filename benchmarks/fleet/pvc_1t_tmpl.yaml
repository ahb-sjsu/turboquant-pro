# Template: __I__ = server id (0..499). 1T hot-tier volume.
#
# 2B rows/server x 24.01 B/row = 48.0 GB, on a 56Gi claim for headroom, inside
# the 64Gi-per-PVC Gatekeeper cap. 500 volumes x 400 shards x 5M rows = 1T.
#
# storageClassName is linstor-unl, NOT the linstor-ha the smaller runs used.
# linstor-ha sets autoPlace=3, so 24 TB of index would cost 72 TB of disk, and
# the provisioner refused 498 of 500 claims with DeadlineExceeded on
# 2026-08-03. linstor-unl is autoPlace=1, so the ask equals the data size.
# Replication buys little here: the corpus is seed-defined, so a lost volume is
# rebuilt from its seed by the per-shard resume path rather than restored from
# a replica.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tqp-fleet-1t-__I__
  namespace: ssu-atlas-ai
  labels: {app: tqp-fleet}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: linstor-unl
  resources: {requests: {storage: 56Gi}}
