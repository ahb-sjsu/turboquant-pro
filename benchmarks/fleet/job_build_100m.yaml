# 100M SMOKE (driver100m_smoke.sh). Template: __I__ = server id (0..3). One of
# four build jobs: 25M seeded rows (5 shards x 5M) onto this server's own
# 5Gi Linstor PVC, tens of seconds of compute, same code path and platform
# envelope (cpu=6/8Gi, requests==limits, CPU-pegged) as the 100B build so the
# wave / retry / straggler machinery is exercised end to end cheaply.
# Reuses the 1B bootstrap basis + global coarse quantizer from tqp-fleet-shared.
apiVersion: batch/v1
kind: Job
metadata:
  name: tqp-smoke100m-build-__I__
  namespace: ssu-atlas-ai
  labels: {app: tqp-fleet, "atlas.io/batch": tqp-100b}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: {app: tqp-fleet, "atlas.io/batch": tqp-100b}
    spec:
      restartPolicy: Never
      containers:
      - name: build
        image: python:3.12
        command: ["/bin/bash", "-lc"]
        args:
        - |
          set -euo pipefail
          export PIP_ROOT_USER_ACTION=ignore PYTHONUNBUFFERED=1
          pip install -q --no-cache-dir numpy
          git clone -q --depth 1 https://github.com/ahb-sjsu/turboquant-pro.git /repo
          cd /repo && git log --oneline -1
          export PYTHONPATH=/repo:/work
          python /work/fleet_build.py
        env:
        - {name: TQP_SERVER_ID, value: "__I__"}
        - {name: TQP_SHARDS_PER_SERVER, value: "5"}
        - {name: TQP_WRITE_ORIGINALS, value: "0"}
        - {name: TQP_EXPORT_PREFIX, value: "server100m_"}
        resources:
          requests: {cpu: "6", memory: 8Gi, ephemeral-storage: 5Gi}
          limits: {cpu: "6", memory: 8Gi, ephemeral-storage: 5Gi}
        volumeMounts:
        - {name: idx, mountPath: /idx}
        - {name: shared, mountPath: /shared}
        - {name: code, mountPath: /work}
      volumes:
      - name: idx
        persistentVolumeClaim: {claimName: tqp-smoke100m-__I__}
      - name: shared
        persistentVolumeClaim: {claimName: tqp-fleet-shared}
      - name: code
        configMap: {name: tqp-fleet-code}
